<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUKEBOX SYSTEM</title>
    <meta name="description" content="Stream your Google Drive music library.">
    <link rel="stylesheet" href="/css/app.css">

    <!-- An SVG favicon so it can invert for dark browser chrome, which the previous
         emoji data-URI could not do. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <!-- iOS ignores the manifest for the home-screen icon. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">

    <link rel="manifest" href="/manifest.webmanifest">

    <!-- The manifest's theme_color cannot be conditional, so the browser-chrome colour
         needs one meta tag per scheme. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
</head>
<body>
    <!-- Keyboard users can reach the library without traversing the whole nav. -->
    <a class="skip-link" href="#view">SKIP TO CONTENT</a>

    <!--
      Two live regions with different urgency. Errors interrupt; route and track
      changes are announced only when the user is idle. Sync progress deliberately
      uses neither: announcing a thousand filenames would be hostile, so it exposes
      a progressbar that assistive tech can poll instead.
    -->
    <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <div id="alerts" class="sr-only" role="alert"></div>

    <header class="topbar" id="topbar" hidden>
        <!--
          The brand and the nav are one column, so NOW PLAYING sits directly under the logo
          rather than beside it. The brand is a link to what is playing -- a logo that goes
          somewhere is the convention, and "somewhere" for a music player is the thing it is
          doing -- but it is styled as a brand, not as body-copy link.
        -->
        <div class="topbar__identity">
            <a class="topbar__brand" href="/now" data-route="/now">JUKEBOX</a>

            <!--
              No NOW PLAYING entry: the wordmark directly above it goes to the same place, and two
              controls side by side leading to one view is just a wider nav.
            -->
            <nav class="topbar__nav" aria-label="Views">
                <a class="navlink" href="/library" data-route="/library">LIBRARY</a>
                <a class="navlink" href="/albums" data-route="/albums">ALBUMS</a>
                <a class="navlink" href="/artists" data-route="/artists">ARTISTS</a>
                <a class="navlink" href="/playlists" data-route="/playlists">PLAYLISTS</a>
                <a class="navlink" href="/queue" data-route="/queue">QUEUE</a>
            </nav>
        </div>

        <span class="topbar__spacer"></span>

        <span class="topbar__status" id="syncChip" hidden></span>

        <!--
          An icon, not a labelled button. Sync is something you reach for rarely -- the library
          refreshes itself every fifteen minutes -- so it does not deserve the width a word
          costs in a nav that now has six entries. aria-label carries the name it lost.
        -->
        <button class="icon-btn" id="syncButton" type="button" aria-label="Sync your Drive library now">
            <!--
              Two arrows chasing each other round a circle: the refresh-a-relationship idiom, not
              the reload-this-page one. Inline SVG rather than a glyph, because the single-arrow
              U+27F3 that was here reads as a browser reload button, and no font is guaranteed to
              have the two-arrow character at all.
            -->
            <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 11a8 8 0 0 0-13.6-4.6L3 9" />
                <polyline points="3 4 3 9 8 9" />
                <path d="M4 13a8 8 0 0 0 13.6 4.6L21 15" />
                <polyline points="21 20 21 15 16 15" />
            </svg>
        </button>

        <!--
          The account menu. Accounts and Sign out are both rare, both about "you" rather than
          about the music, and both were previously competing with the views for nav space.
        -->
        <div class="menu">
            <button class="menu__trigger" id="profileButton" type="button"
                    aria-haspopup="true" aria-expanded="false" aria-controls="profileMenu">
                <img class="menu__avatar" id="profileAvatar" alt="" width="28" height="28" hidden>
                <span class="menu__initial" id="profileInitial" aria-hidden="true"></span>
                <span class="sr-only" id="profileName">Account</span>
                <span class="menu__caret" aria-hidden="true">&#9662;</span>
            </button>

            <div class="menu__panel" id="profileMenu" role="menu" hidden>
                <span class="menu__email" id="profileEmail"></span>

                <!-- Shown only to administrators. Hidden here rather than absent, because
                     main.js asserts every id in its dom map exists at startup. -->
                <a class="menu__item" href="/admin" data-route="/admin" id="adminLink" role="menuitem" hidden>ACCOUNTS</a>

                <button class="menu__item" id="signOutButton" type="button" role="menuitem">SIGN OUT</button>
            </div>
        </div>
    </header>

    <!-- tabindex allows the router to move focus here after a view change, so a
         keyboard user is not left on a nav link that no longer describes the page. -->
    <main id="view" tabindex="-1"></main>

    <!--
      The transport lives outside #view and is never re-rendered by the router. That is
      what makes playback survive navigation, which the previous two-page,
      full-reload design could not do at all.
    -->
    <div class="transport" id="transport" role="region" aria-label="Now playing and playback controls" hidden>
        <div class="transport__art" id="nowArt" aria-hidden="true">♪</div>

        <div class="transport__meta">
            <span class="transport__title" id="nowTitle">SELECT TRACK TO BEGIN</span>
            <span class="transport__sub" id="nowSub"></span>
        </div>

        <div class="transport__controls">
            <button class="icon-btn" id="prevButton" type="button" aria-label="Previous track">
                <span aria-hidden="true">&#9198;</span>
            </button>
            <button class="icon-btn" id="playButton" type="button" aria-label="Play" aria-keyshortcuts="Space">
                <span aria-hidden="true" id="playGlyph">&#9654;</span>
            </button>
            <button class="icon-btn" id="nextButton" type="button" aria-label="Next track">
                <span aria-hidden="true">&#9197;</span>
            </button>
            <button class="btn btn--sm" id="shuffleButton" type="button" aria-pressed="false">SHUFFLE</button>
            <button class="btn btn--sm" id="repeatButton" type="button"
                    data-state="off" aria-label="Repeat: off. Activate for repeat all.">REPEAT</button>
        </div>

        <div class="transport__seek">
            <label class="sr-only" for="seek">Seek</label>
            <input class="range" id="seek" type="range" min="0" max="0" step="1" value="0"
                   aria-valuetext="0 seconds of 0 seconds">
            <span class="transport__time"><time id="position">0:00</time> / <time id="duration">0:00</time></span>
        </div>
    </div>

    <!--
      One audio element for the lifetime of the page. Re-creating it per view is what
      makes playback stop on navigation, and on iOS a freshly created element may
      silently refuse to play because it has no user-gesture history.
      No `controls`: the transport above is the control surface.
    -->
    <audio id="audio" preload="metadata"></audio>

    <!--
      Rendered by cloning templates rather than assembling innerHTML. The previous
      player built rows by string concatenation, which is why escaping had to be
      remembered at every call site and was missed in the error path.
    -->
    <template id="tpl-track-row">
        <li class="list-row" role="option">
            <span class="list-row__num"></span>
            <span class="list-row__title"></span>
            <span class="list-row__artist"></span>
            <span class="list-row__album"></span>
            <time class="list-row__duration"></time>
        </li>
    </template>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
