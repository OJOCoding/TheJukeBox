<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUKEBOX PLAYER</title>
    <link rel="stylesheet" href="/css/player.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">

</head>
<body>
    <div class="container">
        <!-- Close Button -->
        <a href="/" class="close-btn" title="Close Player">X</a>

        <div class="header">
            <h1>JUKEBOX PLAYER</h1>
            <p>AUDIO PLAYBACK INTERFACE</p>
        </div>

        <div class="stats" id="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalSongs">0</div>
                <div class="stat-label">Total Songs</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="currentTrack">-</div>
                <div class="stat-label">Now Playing Song No.</div>
            </div>
        </div>

        <div class="player-section">
            <div class="now-playing">
                <div class="album-art">🎵</div>
                <div class="track-info">
                    <h3 id="currentTrackName">SELECT TRACK TO BEGIN</h3>
                    <p id="currentTrackInfo">CLICK ANY SONG FROM PLAYLIST</p>
                </div>
            </div>

            <div class="audio-player">
                <audio id="audioPlayer" controls preload="metadata">
                    Your browser does not support the audio element.
                </audio>
            </div>

            <div class="controls">
                <button class="control-btn" onclick="playPrevious()">⏮ PREV</button>
                <button class="control-btn" id="playPauseBtn" onclick="playPause()">⏯ PLAY/PAUSE</button>
                <button class="control-btn" onclick="playNext()">⏭ NEXT</button>
                <button class="control-btn" id="shuffleBtn" onclick="toggleShuffle()">SHUFFLE</button>
                <button class="control-btn" id="repeatBtn" onclick="toggleRepeat()">REPEAT</button>
                <button class="control-btn" onclick="refreshLibrary()">REFRESH</button>
            </div>
        </div>

        <div class="playlist">
            <h3>MUSIC LIBRARY</h3>
            <div id="playlist">
                <div class="loading">LOADING AUDIO FILES...</div>
            </div>
        </div>
    </div>
    <script src="/js/player.js"></script>
</body>
</html>
