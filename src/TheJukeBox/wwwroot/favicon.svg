<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The design language at 32 pixels: a bordered square with the signature hard offset
    shadow and one L-shaped registration corner. Replaces the emoji data-URI favicon, which
    was a colour glyph in a two-colour system and rendered differently on every platform.

    The media query inverts it for dark browser chrome. An SVG favicon is the only kind that
    can adapt, which is most of the reason to use one.
  -->
  <style>
    .ink { fill: #000000; }
    .paper { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #ffffff; }
      .paper { fill: #000000; }
    }
  </style>

  <!-- Offset shadow. -->
  <rect class="ink" x="7" y="7" width="23" height="23" />

  <!-- Face. -->
  <rect class="paper" x="2" y="2" width="23" height="23" />
  <rect class="ink" x="2" y="2" width="23" height="2" />
  <rect class="ink" x="2" y="23" width="23" height="2" />
  <rect class="ink" x="2" y="2" width="2" height="23" />
  <rect class="ink" x="23" y="2" width="2" height="23" />

  <!-- Registration corner, top right. -->
  <rect class="ink" x="17" y="6" width="2" height="7" />
  <rect class="ink" x="17" y="6" width="6" height="2" />
</svg>
